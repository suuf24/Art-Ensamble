<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Quiz - English for Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Modern Reset & Base Styles */
        :root {
            --primary-bg: #FFF9E8;
            --glass-bg: #FFFFFF;
            --glass-border: #E8DCC8;
            --text-color: #2D3436;
            --accent-orange: #FF7B54;
            --accent-yellow: #FFB347;
            --accent-green: #7DCFB6;
            --accent-blue: #00B4D8;
            --accent-pink: #FF6B9D;
            --accent-purple: #9B5DE5;
            --correct-color: #7DCFB6;
            --wrong-color: #FF6B9D;
            --button-hover: #FFF0DB;

            /* Fluid Typography Variables (MAXIMIZED FOR TV) */
            --fs-title: clamp(1.8rem, 4vh, 3rem);
            --fs-question: clamp(1.4rem, 4vh, 4rem);
            --fs-option: clamp(1.1rem, 2.5vh, 2.2rem);
            --fs-nav: clamp(1rem, 1.5vh, 1.2rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, #FFE4C9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow-x: hidden;
            padding: 20px;
        }

        h1, h2, h3, .title-font {
            font-family: 'Fredoka', sans-serif;
        }

        /* Animated Background Shapes */
        .background-shapes div {
            position: absolute;
            border-radius: 50%;
            animation: float 20s infinite linear;
            z-index: -1;
            opacity: 0.4;
        }

        .shape1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, var(--accent-yellow) 0%, transparent 70%);
        }

        .shape2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            background: radial-gradient(circle, var(--accent-green) 0%, transparent 70%);
            animation-delay: -5s !important;
        }

        .shape3 {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 80%;
            background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
            animation-delay: -10s !important;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(50px, 50px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Glassmorphism Container */
        .quiz-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #E8DCC8;
            border-radius: 50px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-yellow));
            transition: width 0.3s ease;
            border-radius: 50px;
        }

        h1 {
            font-size: var(--fs-title);
            margin-bottom: 10px;
            color: var(--accent-orange);
            text-shadow: 2px 2px 0px rgba(255, 123, 84, 0.2);
            line-height: 1.2;
        }

        /* Question Section */
        .question-text {
            font-size: var(--fs-question);
            margin-bottom: 30px;
            line-height: 1.4;
            font-weight: 600;
            color: var(--text-color);
            text-align: center;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 3px solid var(--glass-border);
            padding: 18px 24px;
            border-radius: 16px;
            color: var(--text-color);
            text-align: left;
            font-size: var(--fs-option);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            outline: none;
            display: flex;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .option-btn:hover {
            background: var(--button-hover);
            border-color: var(--accent-orange);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 123, 84, 0.15);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
            color: white;
            border-color: var(--accent-orange);
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(255, 123, 84, 0.3);
        }

        .option-btn.selected:hover {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
        }

        /* Navigation Buttons */
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 123, 84, 0.3);
            font-family: 'Fredoka', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 123, 84, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Modal / Overlay */
        .result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-bg) 0%, #FFE4C9 100%);
            z-index: 9999;
            overflow-y: auto;
            padding: 40px;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease;
        }

        .result-content {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 15px 40px rgba(255, 123, 84, 0.3);
            color: white;
            font-family: 'Fredoka', sans-serif;
        }

        .score-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        /* Review List */
        .review-list {
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
            margin-top: 20px;
            padding-right: 10px;
        }

        .review-list::-webkit-scrollbar {
            width: 8px;
        }

        .review-list::-webkit-scrollbar-track {
            background: rgba(232, 220, 200, 0.5);
            border-radius: 50px;
        }

        .review-list::-webkit-scrollbar-thumb {
            background: var(--accent-orange);
            border-radius: 50px;
        }

        .review-item {
            background: white;
            border: 2px solid var(--glass-border);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 5px solid transparent;
        }

        .review-item.correct {
            border-left-color: var(--correct-color);
            background: rgba(125, 207, 182, 0.1);
        }

        .review-item.wrong {
            border-left-color: var(--wrong-color);
            background: rgba(255, 107, 157, 0.1);
        }

        .review-q {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .review-ans {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .review-ans span {
            font-weight: bold;
        }

        .text-correct {
            color: var(--correct-color);
        }

        .text-wrong {
            color: var(--wrong-color);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Review Modal Styles */
        .review-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-bg) 0%, #FFE4C9 100%);
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--glass-border);
        }

        .review-header h2 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-orange);
        }

        .close-review-btn {
            background: white;
            border: 2px solid var(--glass-border);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-color);
            padding: 5px 15px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .close-review-btn:hover {
            background: var(--wrong-color);
            color: white;
            border-color: var(--wrong-color);
        }

        /* Navigation Grid */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .nav-box {
            background: white;
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
            color: var(--text-color);
            font-family: 'Fredoka', sans-serif;
        }

        .nav-box:hover {
            background: var(--button-hover);
            border-color: var(--accent-orange);
        }

        .nav-box.active {
            border-color: var(--accent-orange);
            background: var(--accent-orange);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 123, 84, 0.3);
            transform: scale(1.05);
        }

        .nav-box.answered {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .question-text {
                font-size: 1.2rem;
            }

            .option-btn {
                padding: 12px 16px;
                font-size: 1rem;
            }
            
            .score-circle {
                width: 120px;
                height: 120px;
                font-size: 2.5rem;
            }
        }

        /* Footer */
        .app-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--glass-border);
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            color: var(--text-color);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            text-decoration: none;
            border: 2px solid var(--glass-border);
        }

        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .social-icon:hover {
            transform: translateY(-3px);
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* --- DESKTOP LAYOUT (TV / CLASSROOM MODE > 1024px) --- */
        @media (min-width: 1024px) {
            body {
                padding: 0;
                overflow: hidden;
            }

            .quiz-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                border: none;
                border-radius: 0;
                padding: 40px 60px;
                display: grid;
                grid-template-rows: auto 1fr auto;
                gap: 20px;
                align-items: center;
                backdrop-filter: none;
                background: rgba(255, 255, 255, 0.95);
            }

            header {
                grid-row: 1 / 2;
                margin-bottom: 0;
            }

            h1 {
                font-size: clamp(2rem, 4vh, 3.5rem);
                margin-bottom: 10px;
                text-align: left;
            }

            .progress-container {
                height: 14px;
                margin-top: 20px;
            }

            #quiz-area {
                grid-row: 2 / 3;
                width: 100%;
                max-width: 1000px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
                height: 100%;
                padding-top: 3vh;
            }

            .question-text {
                font-size: clamp(2rem, 5vh, 4.5rem);
                margin-bottom: 4vh;
                font-weight: 700;
            }

            .options-grid {
                display: grid;
                gap: 20px;
                width: 85%;
                margin: 0 auto;
            }

            .option-btn {
                font-size: clamp(1.5rem, 3vh, 2.5rem);
                padding: 2vh 3vw;
                border-width: 3px;
                text-align: center;
                justify-content: center;
            }

            .sidebar-wrapper {
                grid-row: 3 / 4;
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 30px;
                align-items: center;
                padding-top: 20px;
                border-top: 2px solid var(--glass-border);
            }

            #game-nav {
                grid-template-columns: repeat(10, 1fr);
                gap: 10px;
            }

            .nav-box {
                font-size: 1.2rem;
                padding: 12px;
                border-radius: 12px;
            }

            .controls {
                min-width: 200px;
            }

            .btn {
                font-size: 1.4rem;
                padding: 16px 45px;
            }

            .background-shapes,
            .app-footer {
                display: none;
            }
        }

        /* --- MOBILE/TABLET TWEAKS --- */
        @media (max-width: 1023px) {
            h1 { font-size: 1.6rem; }
            .question-text { font-size: 1.3rem; margin-bottom: 20px; }
            .option-btn { font-size: 1.1rem; padding: 14px; }
            .nav-box { font-size: 0.9rem; padding: 8px; }

            .sidebar-wrapper { display: contents; }
            #game-nav { order: 2; margin-top: 25px; }
            .controls { order: 3; justify-content: center; }
            .btn { width: 100%; max-width: 400px; font-size: 1.1rem; }

            .result-overlay { padding: 20px; align-items: flex-start; }
            .result-content { padding-top: 20px; padding-bottom: 50px; }
            .score-circle { width: 120px; height: 120px; font-size: 2.5rem; margin: 10px auto; }
            .result-content h2 { font-size: 1.8rem !important; margin-bottom: 15px !important; }
            .score-text { font-size: 1.1rem; margin-bottom: 20px; }
        }
    </style>
</head>

    </div>

    <!-- Real Result Modal -->
    <div id="result-overlay" class="result-overlay">
        <div class="result-content">
            <h2 style="font-size: 2.5rem; margin-bottom: 20px; color: var(--accent-orange);" class="title-font">Your Result</h2>
            <div class="score-circle" id="final-score">0</div>
            <p class="score-text" id="status-message">Great Job!</p>

            <p style="margin-bottom: 30px; color: #636e72; font-size: 1.1rem;">
                Your answers have been checked.
            </p>

            <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap;">
                <button class="btn" onclick="app.init()">Play Again</button>
            </div>

            <div id="detail-btn-container"></div>
        </div>
    </div>

    <!-- Review Detail Modal -->
    <div id="review-modal" class="review-overlay">
        <div class="result-content" style="text-align: left; max-width: 800px; margin: 0 auto;">
            <div class="review-header">
                <h2 class="title-font">Answer Details</h2>
                <button class="close-review-btn" onclick="app.closeReview()">&times;</button>
            </div>
            <div id="review-list-content" class="review-list" style="max-height: none;"></div>
            <div style="text-align: center; margin-top: 30px; margin-bottom: 50px;">
                <button class="btn" onclick="app.closeReview()">Close</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Music Quiz - English for Kids (Grade 2)
         * Present Simple Tense Focus
         */

        const masterData = [
            { q: "Music expresses our ______.", a: ["feelings", "toys", "food", "books"], correct: "feelings" },
            { q: "A ______ is a sound in music.", a: ["note", "ball", "car", "tree"], correct: "note" },
            { q: "______ is a repeating pattern of sounds.", a: ["Rhythm", "Color", "Number", "Letter"], correct: "Rhythm" },
            { q: "Melody is a line of ______ and low notes.", a: ["high", "big", "small", "long"], correct: "high" },
            { q: "Major notes sound ______ and bright.", a: ["happy", "sad", "angry", "sleepy"], correct: "happy" },
            { q: "Minor notes sound ______ and serious.", a: ["sad", "happy", "funny", "loud"], correct: "sad" },
            { q: "Slendro notes have ______ notes.", a: ["5", "7", "3", "10"], correct: "5" },
            { q: "Tempo is the ______ of the music.", a: ["speed", "color", "name", "size"], correct: "speed" },
            { q: "Dynamics is how ______ or soft the music is.", a: ["loud", "fast", "slow", "tall"], correct: "loud" },
            { q: "We play music together in an ______.", a: ["ensemble", "office", "garden", "pocket"], correct: "ensemble" },
            { q: "A pianica is a ______ instrument.", a: ["melodic", "rhythmic", "heavy", "empty"], correct: "melodic" },
            { q: "A drum keeps the ______.", a: ["beat", "water", "door", "bag"], correct: "beat" },
            { q: "Sinanggar Tullo is from North ______.", a: ["Sumatera", "Java", "Bali", "Papua"], correct: "Sumatera" },
            { q: "Sajojo is a song from ______.", a: ["Papua", "Java", "Sumatera", "Bali"], correct: "Papua" },
            { q: "Fast tempo means the music is ______.", a: ["quick", "slow", "quiet", "sleepy"], correct: "quick" },
        ];

        class QuizApp {
            constructor() {
                this.dataset = [];
                this.currentQuestionIndex = 0;
                this.userAnswers = {};

                // DOM Elements
                this.quizArea = document.getElementById('quiz-area');
                this.controls = document.getElementById('game-controls');
                this.progressBar = document.getElementById('progress-bar');
                this.resultTrigger = document.getElementById('result-trigger');
                this.resultOverlay = document.getElementById('result-overlay');
                this.reviewModal = document.getElementById('review-modal');
                this.header = document.getElementById('game-header');

                // Keyboard Listener
                document.addEventListener('keydown', (e) => this.handleInput(e));

                this.init();
            }

            handleInput(e) {
                if (this.quizArea.style.display === 'none') return;
                const key = e.key;
                if (key >= '1' && key <= '4') {
                    const idx = parseInt(key) - 1;
                    const optionsCount = this.dataset[this.currentQuestionIndex].options.length;
                    if (idx < optionsCount) {
                        this.selectOption(idx);
                    }
                } else if (key === 'Enter') {
                    e.preventDefault();
                    this.nextQuestion();
                }
            }

            init() {
                this.currentQuestionIndex = 0;
                this.userAnswers = {};
                this.dataset = this.randomizeQuestions(masterData, 10);

                this.resultTrigger.style.display = 'none';
                this.resultOverlay.style.display = 'none';
                this.reviewModal.style.display = 'none';
                this.header.style.display = 'block';
                this.quizArea.style.display = 'block';
                this.controls.style.display = 'flex';
                document.getElementById('game-nav').style.display = 'grid';

                this.renderNavGrid();
                this.renderQuestion();
            }

            randomizeQuestions(sourceData, count) {
                let shuffled = [...sourceData].sort(() => 0.5 - Math.random());
                let selected = shuffled.slice(0, count);
                return selected.map(item => {
                    const options = [...item.a];
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    return {
                        question: item.q,
                        options: options,
                        correct: item.correct
                    };
                });
            }

            renderQuestion() {
                const qData = this.dataset[this.currentQuestionIndex];
                const progress = ((this.currentQuestionIndex + 1) / this.dataset.length) * 100;
                this.progressBar.style.width = `${progress}%`;

                this.quizArea.innerHTML = `
                    <div class="question-card active">
                        <div class="question-text">${qData.question}</div>
                        <div class="options-grid">
                            ${qData.options.map((opt, idx) => `
                                <button class="option-btn" onclick="app.selectOption(${idx})" id="opt-${idx}">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                this.updateNavGrid();
                this.renderControls();

                const savedAns = this.userAnswers[this.currentQuestionIndex];
                if (savedAns) {
                    const savedIdx = qData.options.indexOf(savedAns);
                    if (savedIdx !== -1) {
                        this.highlightOption(savedIdx);
                    }
                }
            }

            renderControls() {
                const isLast = this.currentQuestionIndex === this.dataset.length - 1;
                const answered = this.userAnswers[this.currentQuestionIndex] !== undefined;

                this.controls.innerHTML = `
                    <button class="btn" id="next-btn" onclick="app.nextQuestion()">
                        ${isLast ? 'Finish & See Score' : (answered ? 'Next' : 'Skip')} 
                    </button>
                `;
            }

            selectOption(idx) {
                const val = this.dataset[this.currentQuestionIndex].options[idx];
                if (this.userAnswers[this.currentQuestionIndex] === val) {
                    delete this.userAnswers[this.currentQuestionIndex];
                    const btn = document.getElementById(`opt-${idx}`);
                    if (btn) btn.classList.remove('selected');
                } else {
                    this.userAnswers[this.currentQuestionIndex] = val;
                    this.highlightOption(idx);
                }
                this.updateNavGrid();
                this.renderControls();
            }

            highlightOption(idx) {
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.classList.remove('selected'));
                const selectedBtn = document.getElementById(`opt-${idx}`);
                if (selectedBtn) {
                    selectedBtn.classList.add('selected');
                }
            }

            nextQuestion() {
                if (this.currentQuestionIndex < this.dataset.length - 1) {
                    this.currentQuestionIndex++;
                    this.renderQuestion();
                } else {
                    this.showResults();
                }
            }

            renderNavGrid() {
                const navContainer = document.getElementById('game-nav');
                navContainer.innerHTML = '';
                this.dataset.forEach((_, index) => {
                    const box = document.createElement('div');
                    box.className = 'nav-box';
                    box.textContent = index + 1;
                    box.onclick = () => app.jumpToQuestion(index);
                    box.id = `nav-box-${index}`;
                    navContainer.appendChild(box);
                });
            }

            updateNavGrid() {
                this.dataset.forEach((_, index) => {
                    const box = document.getElementById(`nav-box-${index}`);
                    if (!box) return;
                    box.className = 'nav-box';
                    if (this.userAnswers[index] !== undefined) {
                        box.classList.add('answered');
                    }
                    if (index === this.currentQuestionIndex) {
                        box.classList.add('active');
                    }
                });
            }

            jumpToQuestion(index) {
                this.currentQuestionIndex = index;
                this.renderQuestion();
            }

            showResults() {
                let score = 0;
                this.lastReviewHTML = '';
                this.dataset.forEach((q, idx) => {
                    const userAns = this.userAnswers[idx];
                    const isCorrect = userAns === q.correct;
                    if (isCorrect) score++;

                    this.lastReviewHTML += `
                        <div class="review-item ${isCorrect ? 'correct' : 'wrong'}">
                            <div class="review-q">${idx + 1}. ${q.question}</div>
                            <div class="review-ans">
                                Your answer: <span class="${isCorrect ? 'text-correct' : 'text-wrong'}">${userAns || '-'}</span>
                                ${!isCorrect ? `<br>Correct answer: <span class="text-correct">${q.correct}</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                document.getElementById('final-score').textContent = score;

                const detailBtn = document.createElement('button');
                detailBtn.className = 'btn';
                detailBtn.style.marginTop = '20px';
                detailBtn.style.background = 'linear-gradient(135deg, var(--accent-blue), var(--accent-green))';
                detailBtn.textContent = 'See Answer Details';
                detailBtn.onclick = () => { app.openReview(); };

                this.resultTrigger.innerHTML = '';

                const percentage = (score / this.dataset.length) * 100;
                let msg = "";
                if (percentage === 100) msg = "Perfect! You are a Music Star!";
                else if (percentage >= 80) msg = "Great job! Almost perfect!";
                else if (percentage >= 50) msg = "Good try! Keep learning!";
                else msg = "Don't give up! Practice more!";
                document.getElementById('status-message').textContent = msg;

                let detailBtnContainer = document.getElementById('detail-btn-container');
                if (!detailBtnContainer) {
                    detailBtnContainer = document.createElement('div');
                    detailBtnContainer.id = 'detail-btn-container';
                    document.getElementById('status-message').after(detailBtnContainer);
                }
                detailBtnContainer.innerHTML = '';
                detailBtnContainer.appendChild(detailBtn);

                this.header.style.display = 'none';
                this.quizArea.style.display = 'none';
                this.controls.style.display = 'none';
                document.getElementById('game-nav').style.display = 'none';
                this.resultTrigger.style.display = 'none';

                this.resultOverlay.style.display = 'block';
            }

            openReview() {
                const reviewContent = document.getElementById('review-list-content');
                reviewContent.innerHTML = this.lastReviewHTML || '<p>No review data.</p>';
                this.reviewModal.style.display = 'block';
            }

            closeReview() {
                this.reviewModal.style.display = 'none';
            }
        }

        const app = new QuizApp();
    </script>
</body>

</html>
